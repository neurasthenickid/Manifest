name: Create new release drafts only
on:
  push:
    tags:
      - '*.*.*'
      - 'headers-*'
permissions:
  contents: read
concurrency:
  group: manifest-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECKED_COMMIT: ${{ github.sha }}
      TAG_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - run: node scripts/validate-ref.mjs
      - run: pnpm collection
      - run: pnpm run pack
      - run: node scripts/seal-release.mjs
      - name: Create an immutable new draft, never overwrite an existing release
        run: node scripts/tag-draft.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
